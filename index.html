<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAÍZ-SAR AI — Piura</title>
<meta name="description" content="Map-first planning of root-forming vegetation for erosion and huaico-risk reduction in Piura, with NISAR and Sentinel-1 radar, HLS imagery, Copernicus terrain and an AI-assisted future scenario in AR.">
<meta name="theme-color" content="#1b2226">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="/app/styles.css">
<script defer src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.1/dist/maplibre-gl.js"></script>

<!-- Pure, DOM-free logic shared by the app modules and the property tests (tests/js extract this block). -->
<script id="raiz-core">
(function (root) {
  "use strict";
  const HORIZONS = [0, 3, 6, 12];
  const ASSETS = ["shrub_tree_small", "broad_tree", "dry_forest_tree", "umbrella_tree", "round_shrub_tree"];
  const STAGES = ["seed_deposition", "germination", "early_establishment", "establishment"];
  const STEPS = ["explore", "zones", "evidence", "compare", "plan", "future", "report"];
  const JOB_LEGAL = {
    validating: ["queued", "failed"], queued: ["running", "cancelled", "failed"],
    running: ["ready", "partial", "failed", "cancelled", "queued"], failed: ["queued"],
    cancelled: ["queued"], partial: ["queued"], ready: ["queued"],
  };
  const JOB_TERMINAL = new Set(["ready", "partial", "failed", "cancelled"]);

  // AR session state machine: events move between declared states only.
  const AR_TRANSITIONS = {
    idle: { start: "capability_check", preview: "preview" },
    capability_check: { supported: "permission_request", unsupported: "unsupported", end: "ended" },
    permission_request: { granted: "registering", denied: "permission_denied", error: "failed", end: "ended" },
    registering: { target_found: "active", error: "failed", end: "ended" },
    active: { target_lost: "tracking_lost", end: "ended", stale_plan: "ended" },
    tracking_lost: { target_found: "active", end: "ended", stale_plan: "ended" },
    preview: { end: "ended" },
    unsupported: { end: "ended", preview: "preview" },
    permission_denied: { end: "ended", preview: "preview", start: "capability_check" },
    failed: { end: "ended", preview: "preview", start: "capability_check" },
    ended: { start: "capability_check", preview: "preview" },
  };
  function arTransition(state, event) {
    const next = (AR_TRANSITIONS[state] || {})[event];
    return next === undefined ? state : next;
  }
  function jobLegal(from, to) { return (JOB_LEGAL[from] || []).includes(to); }

  // A response is accepted only if it answers the latest request of its kind for the version on screen.
  function createVersionGuard() {
    const latest = {};
    let seq = 0;
    return {
      issue(kind, planVersion) { seq += 1; latest[kind] = seq; return { kind, seq, planVersion }; },
      accept(token, currentPlanVersion, responsePlanVersion) {
        if (!token || latest[token.kind] !== token.seq) return false;
        if (token.planVersion !== currentPlanVersion) return false;
        if (responsePlanVersion !== undefined && responsePlanVersion !== null && responsePlanVersion !== currentPlanVersion) return false;
        return true;
      },
      invalidate(kind) { seq += 1; latest[kind] = seq; },
    };
  }

  const DEPENDENTS = {
    scenario: ["dataset", "sector", "plan", "scene", "report", "evidence"],
    dataset: ["sector", "plan", "scene", "report"],
    plan_inputs: ["plan", "scene", "report"],
    plan: ["scene", "report"],
    scene: ["report"],
  };
  function dependentsOf(change) { return (DEPENDENTS[change] || []).slice(); }

  // Which workflow steps are open, and why a closed one is closed (the UI shows the reason).
  function stepAvailability(s) {
    const hasZones = !!(s && s.dataset && s.dataset.sectors && s.dataset.sectors.features.length);
    const funded = !!(s && s.plan && s.plan.budget && s.plan.budget.allocations.some((a) => a.capsules > 0));
    return {
      explore: { open: true, reason: "" },
      zones: { open: true, reason: "" },
      evidence: { open: hasZones, reason: hasZones ? "" : "Confirm at least one zone first." },
      compare: { open: true, reason: "" },
      plan: { open: hasZones, reason: hasZones ? "" : "Confirm at least one zone first." },
      future: { open: funded, reason: funded ? "" : "Compute a plan with at least one funded zone first." },
      report: { open: !!(s && s.plan), reason: s && s.plan ? "" : "Compute a plan first." },
    };
  }

  function formatPEN(cents) {
    if (cents === null || cents === undefined || !Number.isFinite(cents)) return "—";
    return "S/ " + (cents / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function formatCount(n) { return Number.isFinite(n) ? Math.round(n).toLocaleString("en-US") : "—"; }
  function quantityText(q) {
    if (!q || q.value === null || q.value === undefined) return "Unknown";
    const unit = q.unit === "percent" ? "%" : (q.unit === "dimensionless" ? "" : " " + q.unit);
    return (Math.round(q.value * 100) / 100).toLocaleString("en-US") + unit;
  }
  function isFiniteNum(x) { return typeof x === "number" && Number.isFinite(x); }
  function shortText(s, max) { return typeof s === "string" && s.length <= max && !/[<>]/.test(s); }

  // Client-side ring checks (the server validates again with Shapely).
  function segmentsCross(a, b, c, d) {
    const o = (p, q, r) => Math.sign((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]));
    const o1 = o(a, b, c), o2 = o(a, b, d), o3 = o(c, d, a), o4 = o(c, d, b);
    return o1 !== o2 && o3 !== o4 && o1 !== 0 && o2 !== 0 && o3 !== 0 && o4 !== 0;
  }
  function ringSelfIntersects(ring) {
    if (!Array.isArray(ring) || ring.length < 4) return false;
    const n = ring.length - 1; // closed ring: last == first
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        if (Math.abs(i - j) <= 1 || (i === 0 && j === n - 1)) continue; // adjacent edges share a vertex
        if (segmentsCross(ring[i], ring[i + 1], ring[j], ring[j + 1])) return true;
      }
    }
    return false;
  }
  function closeRing(points) {
    if (!Array.isArray(points) || points.length === 0) return [];
    const f = points[0], l = points[points.length - 1];
    return f[0] === l[0] && f[1] === l[1] ? points.slice() : points.concat([f.slice()]);
  }

  function validateScene(spec, expectedPlanVersion) {
    const errors = [];
    if (!spec || typeof spec !== "object") return ["Scene is not an object."];
    if (typeof spec.plan_version !== "string" || spec.plan_version !== expectedPlanVersion) errors.push("Scene plan version does not match the current plan.");
    if (typeof spec.scene_version !== "string" || spec.scene_version.length > 64) errors.push("Invalid scene version.");
    const f = spec.frame;
    if (!f || !isFiniteNum(f.target_aspect) || f.target_aspect < 0.1 || f.target_aspect > 10) errors.push("Invalid AR frame aspect.");
    if (!f || !isFiniteNum(f.meters_per_ar_unit) || f.meters_per_ar_unit <= 0) errors.push("Invalid AR frame scale.");
    if (!f || !isFiniteNum(f.vertical_exaggeration) || f.vertical_exaggeration <= 0 || f.vertical_exaggeration > 1e6) errors.push("Invalid vertical exaggeration.");
    const half = f && isFiniteNum(f.target_aspect) ? f.target_aspect / 2 + 1e-6 : 0;
    if (!Array.isArray(spec.placements) || spec.placements.length > 2000) errors.push("Placements missing or too many.");
    else for (const p of spec.placements) {
      if (!p || !isFiniteNum(p.x) || !isFiniteNum(p.y) || Math.abs(p.x) > 0.5 + 1e-6 || Math.abs(p.y) > half) { errors.push("Placement outside the target."); break; }
      if (!ASSETS.includes(p.asset_id)) { errors.push("Unknown vegetation asset."); break; }
      if (!isFiniteNum(p.reveal_rank) || p.reveal_rank < 0 || p.reveal_rank > 1) { errors.push("Invalid reveal rank."); break; }
    }
    if (!Array.isArray(spec.zones) || spec.zones.length > 500) errors.push("Zones missing or too many.");
    else for (const z of spec.zones) {
      if (!z || !Array.isArray(z.outline) || z.outline.length < 3 || z.outline.length > 5000 ||
          !z.outline.every((pt) => Array.isArray(pt) && pt.length === 2 && isFiniteNum(pt[0]) && isFiniteNum(pt[1]))) { errors.push("Invalid zone outline."); break; }
    }
    if (!Array.isArray(spec.deposition_points) || spec.deposition_points.length > 5000 ||
        !spec.deposition_points.every((pt) => Array.isArray(pt) && pt.length === 2 && isFiniteNum(pt[0]) && isFiniteNum(pt[1]))) errors.push("Invalid deposition points.");
    if (spec.terrain_grid !== undefined && spec.terrain_grid !== null) {
      const g = spec.terrain_grid;
      if (!g || !Number.isInteger(g.nx) || !Number.isInteger(g.ny) || g.nx < 2 || g.ny < 2 || g.nx * g.ny > 20000 ||
          !Array.isArray(g.heights_m) || g.heights_m.length !== g.nx * g.ny || !g.heights_m.every(isFiniteNum)) errors.push("Invalid terrain grid.");
    }
    if (!Array.isArray(spec.stages) || spec.stages.map((s) => s && s.horizon_months).join(",") !== HORIZONS.join(",")) errors.push("Stages must be 0, 3, 6 and 12 months.");
    else {
      let prevH = -1, prevStage = -1;
      for (const s of spec.stages) {
        if (!STAGES.includes(s.stage_label) || !isFiniteNum(s.max_height_m) || !isFiniteNum(s.visible_fraction_of_expected) ||
            s.visible_fraction_of_expected < 0 || s.visible_fraction_of_expected > 1 || s.max_height_m < 0 || s.max_height_m > 20) { errors.push("Invalid stage values."); break; }
        if (s.max_height_m < prevH || STAGES.indexOf(s.stage_label) < prevStage) { errors.push("Stages go backwards."); break; }
        if (!shortText(s.caption, 200)) { errors.push("Invalid stage caption."); break; }
        prevH = s.max_height_m; prevStage = STAGES.indexOf(s.stage_label);
      }
      if (spec.stages[0] && (spec.stages[0].visible_fraction_of_expected !== 0 || spec.stages[0].max_height_m !== 0)) errors.push("Month 0 cannot show plants.");
    }
    if (!spec.inference || !["actual_inference", "fixture"].includes(spec.inference.mode)) errors.push("Unknown inference mode.");
    return errors;
  }

  function visiblePlacements(placements, stage) {
    const frac = stage ? stage.visible_fraction_of_expected : 0;
    return placements.filter((p) => p.reveal_rank < frac);
  }
  function markerHeight(stage, frame) {
    if (!stage || !frame) return 0;
    return (stage.max_height_m * frame.vertical_exaggeration) / frame.meters_per_ar_unit;
  }
  // Bilinear terrain height (AR units) at tabletop (x, y); grid row 0 is the north edge.
  function terrainHeightAt(grid, frame, x, y) {
    if (!grid || !frame) return 0;
    const u = Math.min(1, Math.max(0, x + 0.5));
    const v = Math.min(1, Math.max(0, 0.5 - y / frame.target_aspect));
    const fx = u * (grid.nx - 1), fy = v * (grid.ny - 1);
    const x0 = Math.floor(fx), y0 = Math.floor(fy), x1 = Math.min(grid.nx - 1, x0 + 1), y1 = Math.min(grid.ny - 1, y0 + 1);
    const h = (r, c) => grid.heights_m[r * grid.nx + c];
    const tx = fx - x0, ty = fy - y0;
    const m = (h(y0, x0) * (1 - tx) + h(y0, x1) * tx) * (1 - ty) + (h(y1, x0) * (1 - tx) + h(y1, x1) * tx) * ty;
    // Terrain carries its own declared exaggeration (smaller than the vegetation markers').
    const ve = isFiniteNum(grid.vertical_exaggeration) ? grid.vertical_exaggeration : frame.vertical_exaggeration;
    return (m * ve) / frame.meters_per_ar_unit;
  }
  function tabletopToMetric(frame, x, y) {
    return [x * frame.meters_per_ar_unit + frame.origin_x_m, y * frame.meters_per_ar_unit + frame.origin_y_m];
  }
  function metricToTabletop(frame, x, y) {
    return [(x - frame.origin_x_m) / frame.meters_per_ar_unit, (y - frame.origin_y_m) / frame.meters_per_ar_unit];
  }
  function peruTime(isoUtc) {
    if (!isoUtc) return "Unknown";
    const d = new Date(isoUtc);
    if (Number.isNaN(d.getTime())) return "Unknown";
    return d.toLocaleString("en-GB", { timeZone: "America/Lima", dateStyle: "medium", timeStyle: "short" }) + " (Peru, UTC−5)";
  }
  function backoffDelay(attempt) { return Math.min(4000, Math.round(500 * Math.pow(1.6, Math.max(0, attempt)))); }

  // Rain timing: the wettest days, and the nearest observation dates before and after one of them.
  function rainPeaks(days, n) {
    return (days || []).filter((d) => isFiniteNum(d.mm)).slice().sort((a, b) => b.mm - a.mm || a.date.localeCompare(b.date)).slice(0, n);
  }
  function bracketDates(dates, event) {
    const sorted = (dates || []).slice().sort();
    let before = null, after = null;
    for (const d of sorted) { if (d < event) before = d; else if (d > event && after === null) after = d; }
    return { before, after };
  }

  root.RaizCore = { HORIZONS, ASSETS, STAGES, STEPS, AR_TRANSITIONS, arTransition, jobLegal, JOB_TERMINAL, createVersionGuard,
    dependentsOf, stepAvailability, formatPEN, formatCount, quantityText, validateScene, visiblePlacements, markerHeight,
    terrainHeightAt, tabletopToMetric, metricToTabletop, peruTime, backoffDelay, ringSelfIntersects, closeRing,
    rainPeaks, bracketDates };
})(typeof window !== "undefined" ? window : globalThis);
</script>
</head>
<body>
<a href="#panel" class="skip">Skip to the controls</a>
<div id="status-live" class="sr-only" aria-live="polite"></div>

<div id="map" role="region" aria-label="Map of the study area. Zones and results are also listed in the side panel."></div>

<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3v14M16 17c-4 0-7 3-8 7m8-7c4 0 7 3 8 7M16 17v9m-4-3 4 3 4-3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M3 29h26" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".5"/></svg>
    <div>
      <span class="brand-name">RAÍZ-SAR AI</span>
      <span class="brand-place" id="brand-place">Piura</span>
    </div>
  </div>
  <nav class="steps" aria-label="Workflow">
    <ol id="steps"></ol>
  </nav>
  <div class="status" id="status"></div>
</header>

<aside class="panel" id="panel" aria-labelledby="panel-title">
  <div class="panel-head">
    <h1 id="panel-title">Explore</h1>
    <button class="icon-btn" id="panel-toggle" type="button" aria-expanded="true" aria-controls="panel-body" title="Collapse the panel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</aside>

<section class="legend" id="legend" aria-label="Map legend and data provenance"></section>

<div class="map-tools" role="group" aria-label="Map view">
  <button class="tool" id="btn-3d" type="button" aria-pressed="false" title="Explore Piura on real DEM geometry with territorial controls">3D territory</button>
  <div class="seg tool-seg" id="relief" role="group" aria-label="Vertical exaggeration of the relief" hidden>
    <button type="button" data-ex="1" aria-pressed="false" title="True relief">×1</button>
    <button type="button" data-ex="3" aria-pressed="true" title="Relief exaggerated three times">×3</button>
    <button type="button" data-ex="6" aria-pressed="false" title="Relief exaggerated six times">×6</button>
  </div>
  <button class="tool" id="btn-ar-quick" type="button" title="Camera AR of the future scenario on the printed target">AR</button>
  <button class="tool" id="btn-help" type="button" title="Show the guided tour again">Guide</button>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<!-- Guided tour -->
<div class="tour" id="tour" role="dialog" aria-modal="true" aria-labelledby="tour-title" hidden>
  <div class="tour-card">
    <p class="tour-count" id="tour-count"></p>
    <h2 id="tour-title"></h2>
    <p id="tour-text"></p>
    <div class="row">
      <button class="btn" id="tour-skip" type="button">Skip the guide</button>
      <button class="btn primary" id="tour-next" type="button">Next</button>
    </div>
  </div>
</div>

<!-- AR (camera) overlay -->
<div id="ar-overlay" role="dialog" aria-modal="true" aria-labelledby="ar-title" hidden>
  <div id="ar-container"></div>
  <div class="ar-top">
    <div>
      <h2 id="ar-title">AR future scenario</h2>
      <p id="ar-state" aria-live="polite">Idle</p>
      <p id="ar-labels"></p>
    </div>
    <button class="btn" id="btn-ar-exit" type="button">Exit AR</button>
  </div>
  <div class="ar-hud">
    <div class="seg" role="group" aria-label="Time horizon" id="ar-horizons">
      <button type="button" data-ar-h="0">Seeds</button>
      <button type="button" data-ar-h="1">3 months</button>
      <button type="button" data-ar-h="2">6 months</button>
      <button type="button" data-ar-h="3">12 months</button>
    </div>
    <button class="btn" id="btn-ar-roots" type="button" aria-pressed="false">Illustrative roots</button>
    <button class="btn" type="button" data-ar-huayco="trees">Huayco with trees</button>
    <button class="btn" type="button" data-ar-huayco="none">Huayco without trees</button>
    <button class="btn" id="btn-ar-evidence" type="button" aria-pressed="true">Evidence layer</button>
    <p id="ar-caption"></p>
    <p id="ar-zone-info" aria-live="polite">Tap a zone outline to inspect it.</p>
  </div>
</div>

<div id="print-area" aria-hidden="true"></div>

<script type="module" src="/app/main.js"></script>
</body>
</html>
